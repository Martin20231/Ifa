name: IFATagebuch
options:
  bundleIdPrefix: de.privat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Fotos von Ständen und Produkten werden nur lokal im Messetagebuch gespeichert.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IFATagebuch:
    type: application
    platform: iOS
    sources:
      - path: IFATagebuch
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.privat.IFATagebuch
        INFOPLIST_FILE: IFATagebuch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  IFATagebuch:
    build:
      targets:
        IFATagebuch: all
    run:
      config: Debug
    archive:
      config: Release
